name: CI - fail-closed source verification
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test runner
        run: python -m pip install 'pytest>=8,<10'
      - name: Compile every Python test (including nonstandard filenames)
        run: python -m compileall -q tests
      - name: Execute actual Python tests; fail if collection or tests fail
        run: python -m pytest -q tests -o 'python_files=*.py'
  rust-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Rust source builds
        run: cargo check --all-targets
